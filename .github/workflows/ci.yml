
name: House Price Continuous Delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Train House Price model
        run: python train_model.py

      - name: Check model quality
        run: |
          python -c "import json; m=json.load(open('metrics.json')); print('R2:', m['r2']); print('MAE:', m['mae']); assert m['r2'] >= 0.70, 'R2 score is below 0.70'"

      - name: Run API tests
        run: pytest -v test_app.py

      - name: Package release candidate
        run: |
          mkdir -p release
          cp app.py house_price_model.pkl metrics.json requirements.txt release/
          echo "House Price Prediction API release candidate" > release/README.txt
          echo "Start the application with: python app.py" > release/DEPLOYMENT.txt
          echo "Prediction endpoint: POST /predict" >> release/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: house-price-api-release-candidate
          path: release/
          retention-days: 7
